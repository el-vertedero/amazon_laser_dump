/*
    Parametric EQ Configuration
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

{
    "Bypass"            : false,
    "NumBiquads"        : 4,   // MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1. Add a peak at 700Hz by 6dB
        {
            "FilterType" : "BYPASS",
            "Fc"         : 700,
            "Q"          : 4.0,
            "GaindB"     : 6.0
        },
        // Biquad 2.
        {
            "FilterType" : "BYPASS",
            "Fc"         : 600,
            "Q"          : 0.707,
            "GaindB"     : 5.0
        },
        // Biquad 3
        {
            "FilterType" : "BYPASS",
            "Fc"         : 7000,
            "Q"          : 10,
            "GaindB"     : -6.0
        },
        // Biquad 4
        {
            "FilterType" : "BYPASS",
            "Fc"         : 5000,
            "Q"          : 20,
            "GaindB"     : -20.0
        }
   ]
}
